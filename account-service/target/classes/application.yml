server:
  port: 8083

spring:
  application:
    name: account-service
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://127.0.0.1:3306/account?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat,slf4j
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        fail-fast: false
        retry:
          times: 5
          interval: 2000
    compatibility-verifier:
      enabled: false
# flyway 已移除

management:
  endpoints:
    web:
      exposure:
        include: health,info