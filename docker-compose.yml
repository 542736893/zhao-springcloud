version: "3.9"
services:
  order-service:
    build:
      context: ./order-service
    image: zhao/order-service:1.0.0
    ports:
      - "8081:8081"
  inventory-service:
    build:
      context: ./inventory-service
    image: zhao/inventory-service:1.0.0
    ports:
      - "8082:8082"
  account-service:
    build:
      context: ./account-service
    image: zhao/account-service:1.0.0
    ports:
      - "8083:8083"